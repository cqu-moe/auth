name: CI / Deploy

# 每次 push：先过质量门禁，再按分支处理——
#   main         → D1 迁移 + `wrangler deploy`（生产，接管 100% 流量）
#   其他分支      → `wrangler versions upload`（上传 0 流量版本，可回滚）
#
# ⚠️ 注意：本 Worker 使用 Durable Objects（CquSessionDO + 容器本身即 DO），
# Cloudflare **不为使用 DO 的 Worker 生成 preview URL**，故分支版本拿不到可点的
# 预览链接——versions upload 仅做"构建+上传全链验证 + 可回滚版本"，无法直接访问测试。
# 要可测试的分支环境只能另建独立预览 Worker（未做）。
#
# 容器构建：ubuntu-latest 自带并运行 Docker，wrangler 在 runner 上构建 linux/amd64
# 容器镜像并推送，与本地 `npm run deploy` 等价。
#
# 需要的 repo secrets：CLOUDFLARE_API_TOKEN（Workers Scripts:Edit + D1:Edit +
# Containers:Edit）、CLOUDFLARE_ACCOUNT_ID。
on:
  push:
    branches: ['**']
    # 纯文档/忽略文件改动不触发部署（main 自动部署下省一次无谓生产重部署）。
    paths-ignore:
      - '**.md'
      - 'docs/**/*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # 分支被新 push 取代时取消在跑的旧 run 省额度；生产部署绝不中途取消。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # ── 质量门禁（任何分支都先过，门禁挂则不部署/不上传）──
      - name: Install (root)
        run: npm ci

      - name: Install (frontend)
        run: npm ci
        working-directory: frontend

      - name: Typecheck (backend)
        run: npm run typecheck

      - name: Typecheck (Workers tests)
        run: npm run typecheck:do

      - name: Test
        run: npm test

      - name: Test (Workers / Durable Objects)
        run: npm run test:do
        env:
          WRANGLER_LOG_PATH: /tmp/auth-api-v1-wrangler.log

      - name: Check API artifacts
        run: npm run check:api

      - name: Lint API contracts
        run: npm run lint:api

      - name: Check import boundaries
        run: npm run check:boundaries

      - name: Typecheck (frontend)
        run: npx tsc -b
        working-directory: frontend

      - name: Lint (frontend)
        run: npm run lint
        working-directory: frontend

      - name: Build (frontend)
        run: npm run build
        working-directory: frontend

      # ── 生产（main）：迁移先行（幂等，仅 apply 未应用的），再部署接管流量 ──
      - name: Apply D1 migrations (production)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler d1 migrations apply auth-cqu-moe-db --remote

      - name: Deploy to production (main)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy

      # ── 其他分支：上传 0 流量版本（验证容器构建+上传全链 + 可回滚；无预览 URL）──
      - name: Upload version, no traffic (non-main)
        if: github.ref != 'refs/heads/main'
        run: npx wrangler versions upload

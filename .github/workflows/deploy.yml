name: Deploy

# 手动触发部署（Actions 页面点 "Run workflow"）。
# 选手动而非 push main 自动：排查「会话定点过期」期间需要控制部署节奏，
# 频繁自动部署会打断在途的容器重登、造成假高频。过期问题解决后可改为
# on.push.branches=[main] 升级成自动 CD。
#
# 需要的 repo secrets（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   —— CF API token，权限至少：Workers Scripts:Edit、
#                             D1:Edit、Cloudflare Containers:Edit（容器镜像推送）。
#                             可用 "Edit Cloudflare Workers" 模板再补 D1 + Containers。
#   CLOUDFLARE_ACCOUNT_ID  —— CF 账户 ID。
#
# 容器构建：ubuntu-latest 自带并运行 Docker，`wrangler deploy` 会在 runner 上
# 构建 linux/amd64 容器镜像并推送，与本地 `npm run deploy` 等价。
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install (root)
        run: npm ci

      # ── 部署前再过一遍质量门禁，手动部署也不放行坏代码 ──
      - name: Typecheck (backend)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install (frontend)
        run: npm ci
        working-directory: frontend

      - name: Typecheck (frontend)
        run: npx tsc --noEmit
        working-directory: frontend

      # ── 迁移先行：D1 迁移幂等，仅 apply 未应用的（0000-0003 已在 prod，通常 no-op）──
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply auth-cqu-moe-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── 构建前端 + wrangler deploy（含容器构建/推送），复用项目 deploy 脚本 ──
      - name: Build frontend & deploy (Worker + container)
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: Deploy production

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: auth-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'cqu-moe/auth' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_WRITE_LOGS: 'false'
    steps:
      - name: Require the current main commit and successful CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$DEPLOY_SHA" != "$current" ]]; then
            echo "Skipping a superseded main commit."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$DEPLOY_SHA&event=push" --jq '.workflow_runs | map(select(.head_branch == "main")) | sort_by(.run_number) | last | .conclusion')
          test "$result" = success
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.gate.outputs.deploy == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.gate.outputs.deploy == 'true'
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.gate.outputs.deploy == 'true'
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.deploy == 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.deploy == 'true'
        working-directory: frontend
      - name: Verify the production container build
        if: steps.gate.outputs.deploy == 'true'
        run: npm run test:container
      - name: Publish the verified commit with release source maps
        if: steps.gate.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: '662666'
          POSTHOG_CLI_HOST: https://us.posthog.com
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_HOST: https://p.cqu.moe
        run: |
          test "$CLOUDFLARE_ACCOUNT_ID" = a666c560407022706a52a703923548d5
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$POSTHOG_CLI_API_KEY"
          test -n "$VITE_POSTHOG_PROJECT_TOKEN"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$DEPLOY_SHA"
          npx --no-install wrangler d1 migrations apply auth-cqu-moe-db --remote
          npm run deploy

name: Tests
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A unique non-PR group also avoids replacing queued main commits.
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames -z "$BASE...$HEAD" | node scripts/ci-paths.mjs >> "$GITHUB_OUTPUT"
          else
            echo 'code=true' >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Application checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_LOG_PATH: /tmp/auth-ci-wrangler.log
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: npm ci
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: node --test scripts/ci-paths.test.mjs e2e/viewports.test.mjs
      - run: npm run typecheck:e2e && npx --no-install tsc -p e2e/school/tsconfig.json
      - run: npm run check:ci
      - run: npm run build:ci
      - run: npm run package:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auth-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  container:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Chromium container tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: bash scripts/test-container.sh
  browser:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Account E2E (${{ matrix.viewport }}, round ${{ matrix.round }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
        round: [1, 2]
    env:
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: npm ci
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # Same lockfile-pinned Playwright as @e2e-dev/web; CI launches only headless shell.
      - run: npx --no-install playwright-core install-deps chromium
      - run: npx --no-install playwright-core install chromium --only-shell
      - run: VITE_POSTHOG_PROJECT_TOKEN= VITE_POSTHOG_HOST= npm --prefix frontend run build
      - run: node e2e/run.mjs
        env:
          AUTH_E2E_VIEWPORT: ${{ matrix.viewport }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auth-browser-${{ matrix.viewport }}-${{ matrix.round }}-${{ github.sha }}
          path: .e2e/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  school:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: School E2E (${{ matrix.viewport }}, round ${{ matrix.round }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
        round: [1, 2]
    env:
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      WRANGLER_SEND_METRICS: 'false'
      AUTH_SCHOOL_DOCKER_SOCKET: /var/run/docker.sock
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: npm ci
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: VITE_POSTHOG_PROJECT_TOKEN= VITE_POSTHOG_HOST= npm --prefix frontend run build
      - run: node e2e/school/build.mjs
      # Same lockfile-pinned Playwright as @e2e-dev/web; CI launches only headless shell.
      - run: npx --no-install playwright-core install-deps chromium
      - run: npx --no-install playwright-core install chromium --only-shell
      - run: node e2e/school/run.mjs
        env:
          AUTH_E2E_VIEWPORT: ${{ matrix.viewport }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auth-school-${{ matrix.viewport }}-${{ matrix.round }}-${{ github.sha }}
          path: .e2e/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  oauth:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: OAuth E2E (${{ matrix.viewport }}, round ${{ matrix.round }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
        round: [1, 2]
    env:
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      WRANGLER_SEND_METRICS: 'false'
      AUTH_SCHOOL_DOCKER_SOCKET: /var/run/docker.sock
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: npm ci
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # Same lockfile-pinned Playwright as @e2e-dev/web; CI launches only headless shell.
      - run: npx --no-install playwright-core install-deps chromium
      - run: npx --no-install playwright-core install chromium --only-shell
      - run: VITE_POSTHOG_PROJECT_TOKEN= VITE_POSTHOG_HOST= npm --prefix frontend run build
      - run: node e2e/school/build.mjs
      - run: node e2e/oauth/run.mjs
        env:
          AUTH_E2E_VIEWPORT: ${{ matrix.viewport }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auth-oauth-${{ matrix.viewport }}-${{ matrix.round }}-${{ github.sha }}
          path: .e2e/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  controls:
    name: E2E negative and cleanup controls
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      WRANGLER_SEND_METRICS: 'false'
      AUTH_SCHOOL_DOCKER_SOCKET: /var/run/docker.sock
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: npm ci
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # Same lockfile-pinned Playwright as @e2e-dev/web; CI launches only headless shell.
      - run: npx --no-install playwright-core install-deps chromium
      - run: npx --no-install playwright-core install chromium --only-shell
      - run: VITE_POSTHOG_PROJECT_TOKEN= VITE_POSTHOG_HOST= npm --prefix frontend run build
      - run: node e2e/school/build.mjs
      - run: node e2e/account-smoke.mjs
      - run: node e2e/self-check.mjs
      - run: node e2e/artifact-safety-check.mjs
      - run: node --test e2e/publication-failure.test.mjs e2e/artifact-mail.test.mjs
      - run: node e2e/school/workflow-probe.mjs
      - run: node e2e/school/container-probe.mjs
      - run: node e2e/school/consumer-smoke.mjs
      - run: node e2e/school/self-check.mjs
      - run: node e2e/oauth/self-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auth-controls-${{ github.sha }}
          path: .e2e/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  cross-browser:
    name: Auth supplement (${{ matrix.browser }}, ${{ matrix.suite }}, round ${{ matrix.round }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        suite: [account, oauth, school]
        round: [1, 2]
    env:
      AUTH_E2E_BROWSER: ${{ matrix.browser }}
      AUTH_E2E_SUITE: ${{ matrix.suite }}
      AUTH_E2E_EXPECT_COMMIT: ${{ github.sha }}
      AUTH_SCHOOL_DOCKER_SOCKET: /var/run/docker.sock
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.22.3'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: npm ci
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: npx --no-install e2e-web install ${{ matrix.browser }} --with-deps
      - run: node --test e2e/oauth/network-proxy.test.mjs
        if: matrix.browser == 'webkit' && matrix.suite == 'oauth' && matrix.round == 1
      - run: VITE_POSTHOG_PROJECT_TOKEN= VITE_POSTHOG_HOST= npm --prefix frontend run build
      - run: node e2e/school/build.mjs
        if: matrix.suite != 'account'
      - run: node e2e/cross-browser.mjs
      - run: node e2e/cross-browser.mjs --self-check
        if: matrix.suite == 'account' && matrix.round == 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auth-cross-browser-${{ matrix.browser }}-${{ matrix.suite }}-${{ matrix.round }}-${{ github.sha }}
          path: .e2e/cross-browser-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  ci:
    name: CI
    if: always()
    needs: [changes, test, container, browser, school, oauth, controls, cross-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require change classification
        env:
          RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          test "$RESULT" = success
          case "$CODE" in true|false) ;; *) exit 1 ;; esac
      - name: Require all checks
        if: needs.changes.outputs.code == 'true'
        env:
          TEST_RESULT: ${{ needs.test.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SCHOOL_RESULT: ${{ needs.school.result }}
          OAUTH_RESULT: ${{ needs.oauth.result }}
          CONTROLS_RESULT: ${{ needs.controls.result }}
        run: test "$TEST_RESULT" = success && test "$CONTAINER_RESULT" = success && test "$BROWSER_RESULT" = success && test "$SCHOOL_RESULT" = success && test "$OAUTH_RESULT" = success && test "$CONTROLS_RESULT" = success
      - name: Require browser supplement before release or manual acceptance
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          CROSS_BROWSER_RESULT: ${{ needs.cross-browser.result }}
        run: test "$CROSS_BROWSER_RESULT" = success
  release:
    name: Versioned build archive
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) process.exit(1)'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: auth-${{ github.sha }}
          path: artifacts
      - name: Publish verified archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          shasum -a 256 -c SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --verify-tag --generate-notes --title "$RELEASE_TAG"

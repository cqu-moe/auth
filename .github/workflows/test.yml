name: Tests
on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  test:
    name: Application checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_LOG_PATH: /tmp/auth-ci-wrangler.log
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: npm run check:ci
      - run: npm run build:ci
      - run: npm run package:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auth-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  container:
    name: Chromium container tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: bash scripts/test-container.sh
  browser:
    name: Built Auth registration and session E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: npx --no-install e2e-web install chromium --with-deps
      - run: npm run test:e2e
      - run: node e2e/account-smoke.mjs
      - run: node e2e/self-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auth-browser-${{ github.sha }}
          path: .e2e/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  school:
    name: Built Auth school and native container E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      WRANGLER_SEND_METRICS: 'false'
      AUTH_SCHOOL_DOCKER_SOCKET: /var/run/docker.sock
      AUTH_SCHOOL_CONTAINER_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: node e2e/school/workflow-probe.mjs
      - run: VITE_POSTHOG_PROJECT_TOKEN= VITE_POSTHOG_HOST= npm --prefix frontend run build
      - run: node e2e/school/build.mjs
      - run: node e2e/school/container-probe.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auth-school-${{ github.sha }}
          path: .e2e/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  ci:
    name: CI
    if: always()
    needs: [test, container, browser, school]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks
        env:
          TEST_RESULT: ${{ needs.test.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SCHOOL_RESULT: ${{ needs.school.result }}
        run: test "$TEST_RESULT" = success && test "$CONTAINER_RESULT" = success && test "$BROWSER_RESULT" = success && test "$SCHOOL_RESULT" = success
  release:
    name: Versioned build archive
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) process.exit(1)'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: auth-${{ github.sha }}
          path: artifacts
      - name: Publish verified archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          shasum -a 256 -c SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --verify-tag --generate-notes --title "$RELEASE_TAG"

name: Tests

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**/*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root)
        run: npm ci

      - name: Install (frontend)
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Test
        run: npm test

      - name: Test (Workers / Durable Objects)
        run: npm run test:do
        env:
          WRANGLER_LOG_PATH: /tmp/auth-api-v1-wrangler.log

      - name: Test (Chromium container)
        run: |
          docker build --platform linux/amd64 -t cqu-browser-tests ./container
          docker run --rm --platform linux/amd64 -v "$PWD:/workspace:ro" cqu-browser-tests \
            sh -c 'python -m pip install --disable-pip-version-check pytest==9.1.1 pytest-asyncio==1.4.0 && PYTHONPATH=/app python -m pytest -q -o cache_dir=/tmp/pytest-cache /workspace/container'

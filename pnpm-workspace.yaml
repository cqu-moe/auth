packages:
  - .
# Preserve the existing npm legacy-peer-deps dependency graph during migration.
autoInstallPeers: false
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  '@posthog/cli': true
  fsevents: true
patchedDependencies:
  miniflare@4.20260521.0: patches/miniflare+4.20260521.0.patch
# Keep npm's locked transitive versions; import otherwise re-resolves these ranges.
overrides:
  '@bramus/specificity': 2.4.2
  '@jridgewell/resolve-uri': 3.1.2
  '@jridgewell/sourcemap-codec': 1.5.5
  expect-type: 1.3.0
  mime: 4.1.0
  source-map-js: 1.2.1
  uri-js-replace: 1.0.1
  'tslib@>=2 <3': 2.8.1
